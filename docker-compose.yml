services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI from the separate Coolify MongoDB resource}
      CLIENT_URL: ${CLIENT_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      APP_URL: ${APP_URL:-http://localhost:5000}
      STORAGE_PATH: /app/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Coolify}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Yanisa HR}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-tech@yanisa.in}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      HR_NOTIFICATION_EMAIL: ${HR_NOTIFICATION_EMAIL:-}
    expose:
      - "5000"
    volumes:
      - sign-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sign-storage:
